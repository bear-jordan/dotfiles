name: Generate configs

on:
  push:
    branches: [main]
    paths: [tools.yaml, .github/workflows/generate.yml]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # git-auto-commit-action pushes with these

      - name: Generate Brewfile
        run: |
          brew_name() {
            case "$1" in
              delta) echo "git-delta" ;;
              rg)    echo "ripgrep" ;;
              tree-sitter) echo "tree-sitter-cli" ;;
              *)     echo "$1" ;;
            esac
          }

          {
            echo "# Generated from tools.yaml — do not edit directly"
            echo ""
            echo "# Shared tools (also managed by mise in devcontainers)"
            yq '.shared[]' tools.yaml | while read -r tool; do
              echo "brew \"$(brew_name "$tool")\""
            done

            echo ""
            echo "# Host-only formulas"
            yq '.host.formulas[]' tools.yaml | while read -r formula; do
              echo "brew \"$formula\""
            done

            echo ""
            echo "# Apps"
            yq '.host.casks[]' tools.yaml | while read -r cask; do
              echo "cask \"$cask\""
            done
          } > Brewfile

      - name: Generate Brewfile.work
        run: |
          {
            echo "# Generated from tools.yaml — do not edit directly"
            echo ""
            yq '.work.formulas[]' tools.yaml | while read -r formula; do
              echo "brew \"$formula\""
            done
            yq '.work.casks[]' tools.yaml | while read -r cask; do
              echo "cask \"$cask\""
            done
          } > Brewfile.work

      - name: Generate mise config.toml
        run: |
          mkdir -p dot_config/mise
          {
            echo "# Generated from tools.yaml — do not edit directly"
            echo ""
            echo "[tools]"
            yq '.shared[], .container[]' tools.yaml | while read -r tool; do
              echo "$tool = \"latest\""
            done
          } > dot_config/mise/config.toml

      - name: Commit generated configs
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: regenerate configs from tools.yaml"
          file_pattern: "Brewfile Brewfile.work dot_config/mise/config.toml"
